<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to My Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #f6d365, #fda085);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
      color: #ff6b6b;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    a.button {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background-color: #ff6b6b;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    a.button:hover {
      background-color: #ff4b4b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Web App</h1>
    <p>This is a simple, beautiful landing page hosted with GitHub Pages!</p>
    <a class="button" href="https://github.com/Rishika3083/web-app" target="_blank">View on GitHub</a>
  </div>
</body>
</html>
